[project]
name = "maglab"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Szymon Oramus"}
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
maglab = "maglab:main"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maglab"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/maglab/**/*.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "NPY",      # numpy-specific
    "PTH",      # use pathlib
    "RUF",      # ruff's own
]
ignore = [
    "E501",     # line length — the formatter owns this
    "E741",     # ambiguous names: l, I, O
    "B905",     # zip() strict= — noisy in numeric code
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting
[tool.ruff.lint.isort]
known-first-party = ["cu_spacer_asi"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]           # asserts are the point
"**/__init__.py" = ["F401"]    # re-exports

[tool.ruff.format]
docstring-code-format = true


